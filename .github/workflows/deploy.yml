name: Deploy GameHub Backend
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/1komron/gamehub-b-:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u 1komron --password-stdin
            docker stop gamehub_backend || true
            docker rm gamehub_backend || true
            docker pull ghcr.io/1komron/gamehub-b-:latest
            docker run -d \
              --name gamehub_backend \
              --network prod_default \
              --restart unless-stopped \
              -p 5050:5050 \
              -e DATABASE_URL=jdbc:postgresql://postgres:5432/gamehub \
              -e DATABASE_USERNAME=postgres \
              -e DATABASE_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e JWT_TTL_SECONDS=864000 \
              -e TELEGRAM_SKIP_VALIDATION=false \
              ghcr.io/1komron/gamehub-b-:latest
            docker image prune -f